services:
  # code-server + InfluxDB 3 Core + produtor de pedidos
  influxdb-lab:
    container_name: influxdb-lab
    image: ghcr.io/infobarbosa/influxdb-lab-docker-image:latest
    ports:
      - "8080:8080"

  # Grafana com o datasource do InfluxDB pré-configurado
  grafana:
    container_name: grafana
    image: grafana/grafana:13.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro
    depends_on:
      - influxdb-lab
